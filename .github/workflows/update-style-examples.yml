name: update-style-examples

on:
  schedule:
    # Run at 04:00 Europe/London year-round. GitHub cron is UTC, so both
    # possible UTC hours are scheduled and the timezone guard keeps one.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: style-learning
  cancel-in-progress: false

jobs:
  update-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check whether this is 04:00 UK time
        id: uk_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/London date +%H)" = "04" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.uk_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.uk_time.outputs.should_run == 'true'
        run: pip install requests

      - name: Restore learning database
        if: steps.uk_time.outputs.should_run == 'true'
        id: restore-style-db
        uses: actions/cache/restore@v4
        with:
          path: style_learning.db
          key: style-learning-${{ github.run_id }}
          restore-keys: |
            style-learning-

      - name: Fetch and analyse TikTok trend structures
        if: steps.uk_time.outputs.should_run == 'true'
        run: python fetch_style_examples.py
        env:
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Learn proven twists from public-domain stories
        if: steps.uk_time.outputs.should_run == 'true'
        run: python fetch_public_domain_examples.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Save learning database
        if: always() && steps.uk_time.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: style_learning.db
          key: style-learning-${{ github.run_id }}

      - name: Commit updated learning outputs
        if: steps.uk_time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add \
            style_examples.json \
            public_domain_story_patterns.json \
            trending_hashtags.json \
            trend_summary.json \
            style_notes.txt \
            target_pace.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No learning-output changes to commit."
          else
            git commit -m "Update story trend and public-domain learning data"
            git push
          fi
