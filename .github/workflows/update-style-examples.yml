name: update-style-examples

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:

concurrency:
  group: style-learning
  cancel-in-progress: false

jobs:
  update-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Keep the SQLite learning database between workflow runs without
      # committing a changing binary database into Git history.
      - name: Restore learning database
        id: restore-style-db
        uses: actions/cache/restore@v4
        with:
          path: style_learning.db
          key: style-learning-${{ github.run_id }}
          restore-keys: |
            style-learning-

      - name: Fetch and analyse TikTok style examples
        run: python fetch_style_examples.py
        env:
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Learn proven twists from public-domain stories
        run: python fetch_public_domain_examples.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Save learning database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: style_learning.db
          key: style-learning-${{ github.run_id }}

      - name: Commit updated learning outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add \
            style_examples.json \
            public_domain_story_patterns.json \
            trending_hashtags.json \
            trend_summary.json \
            style_notes.txt \
            target_pace.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No learning-output changes to commit."
          else
            git commit -m "Update story trend and public-domain learning data"
            git push
          fi
