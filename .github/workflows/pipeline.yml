name: content-pipeline

on:
  schedule:
    # GitHub cron uses UTC. Running at both 05:00 and 06:00 lets the
    # timezone check below keep this at 06:00 Europe/London through DST.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Check whether this is 06:00 UK time
        id: uk_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested — continuing."
          elif [ "$(TZ=Europe/London date +%H)" = "06" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "It is 06:00 in Europe/London — starting daily batch."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not 06:00 in Europe/London — skipping duplicate DST trigger."
          fi

      - name: Set up Python
        if: steps.uk_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system audio deps
        if: steps.uk_time.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python deps
        if: steps.uk_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Retry any backlogged videos first
        if: steps.uk_time.outputs.should_run == 'true'
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_MORNING_QUEUE_ID: ${{ secrets.ZERNIO_MORNING_QUEUE_ID }}
          ZERNIO_MIDDAY_QUEUE_ID: ${{ secrets.ZERNIO_MIDDAY_QUEUE_ID }}
          ZERNIO_AFTERNOON_QUEUE_ID: ${{ secrets.ZERNIO_AFTERNOON_QUEUE_ID }}
          ZERNIO_EVENING_QUEUE_ID: ${{ secrets.ZERNIO_EVENING_QUEUE_ID }}
        run: python retry_pending.py

      - name: Generate and queue all 4 daily videos sequentially
        if: steps.uk_time.outputs.should_run == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_MORNING_QUEUE_ID: ${{ secrets.ZERNIO_MORNING_QUEUE_ID }}
          ZERNIO_MIDDAY_QUEUE_ID: ${{ secrets.ZERNIO_MIDDAY_QUEUE_ID }}
          ZERNIO_AFTERNOON_QUEUE_ID: ${{ secrets.ZERNIO_AFTERNOON_QUEUE_ID }}
          ZERNIO_EVENING_QUEUE_ID: ${{ secrets.ZERNIO_EVENING_QUEUE_ID }}
        run: |
          set -euo pipefail

          run_one_video() {
            video_number="$1"
            echo "============================================================"
            echo "Creating video ${video_number}/4 as a complete pipeline"
            echo "============================================================"

            # Remove generated media from the previous video so nothing can be
            # accidentally reused by the next pipeline cycle.
            rm -f video_url.txt audio_meta.json output.mp3 output.wav final_video.mp4 background.mp4 word_timestamps.json

            echo "[${video_number}/4] 1/5 Fetching a fresh background"
            python fetch_background.py

            echo "[${video_number}/4] 2/5 Generating this video's story and audio"
            python generate_audio.py

            echo "[${video_number}/4] 3/5 Rendering this video"
            python render_video.py

            echo "[${video_number}/4] 4/5 Uploading this video to Cloudinary"
            python upload_to_cloudinary.py

            if [ ! -s video_url.txt ]; then
              echo "video_url.txt was not created for video ${video_number}."
              return 1
            fi

            echo "[${video_number}/4] 5/5 Sending this video to its Zernio queue"
            export VIDEO_URL="$(cat video_url.txt)"
            python upload.py

            echo "Video ${video_number}/4 finished completely before the next video starts."
          }

          run_one_video 1
          run_one_video 2
          run_one_video 3
          run_one_video 4

          echo "All four independent video pipelines completed."

      - name: Commit pipeline state changes
        if: always() && steps.uk_time.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending_queue.json queue_log.json queue_rotation_state.json recent_story_topics.json recent_backgrounds.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update pipeline state" || exit 0
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Could not push state changes after retries."
          exit 1
