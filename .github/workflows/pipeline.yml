name: content-pipeline

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system audio deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Retry any backlogged videos first
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
        run: python retry_pending.py

      - name: Generate and queue all 4 daily videos sequentially
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
          INWORLD_VOICE_NAME: 'Adam'
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
        run: |
          set -euo pipefail

          run_one_video() {
            video_number="$1"
            echo "============================================================"
            echo "Creating video ${video_number}/4 as a complete pipeline"
            echo "============================================================"

            rm -f video_url.txt audio_meta.json narration.wav narration_raw.wav timestamps.json final_short.mp4 background.mp4 story.txt

            echo "[${video_number}/4] 1/5 Fetching a fresh background"
            python fetch_background.py

            echo "[${video_number}/4] 2/5 Generating this video's story and audio"
            python generate_audio.py

            echo "[${video_number}/4] 3/5 Rendering this video"
            python render_video.py

            echo "[${video_number}/4] 4/5 Uploading this video to Cloudinary"
            python upload_to_cloudinary.py

            if [ ! -s video_url.txt ]; then
              echo "video_url.txt was not created for video ${video_number}."
              return 1
            fi

            echo "[${video_number}/4] 5/5 Adding this video to the Buffer TikTok queue"
            export VIDEO_URL="$(cat video_url.txt)"
            python upload.py

            echo "Video ${video_number}/4 finished completely before the next video starts."
          }

          run_one_video 1
          run_one_video 2
          run_one_video 3
          run_one_video 4

          echo "All four independent video pipelines completed."

      - name: Commit pipeline state changes
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending_queue.json queue_log.json recent_story_topics.json recent_backgrounds.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update pipeline state" || exit 0
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Could not push state changes after retries."
          exit 1
