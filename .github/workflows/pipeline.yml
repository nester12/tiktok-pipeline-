name: content-pipeline
on:
  schedule:
    - cron: '0 12 * * *'   # runs once daily at 12:00 UTC, generating 4 videos in sequence
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Retry any backlogged videos first
        run: python retry_pending.py
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}

      - name: Generate and queue 4 videos (2 min apart)
        run: |
          for i in 1 2 3 4; do
            echo "=================================================="
            echo "🎬 Video $i of 4"
            echo "=================================================="

            if ! python check_queue.py; then
              echo "⏭️ Skipping video $i — Buffer queue is full. Remaining videos this run will also be skipped."
              break
            fi

            python fetch_background.py
            python generate_audio.py
            python render_video.py
            python upload_to_cloudinary.py
            export VIDEO_URL=$(cat video_url.txt)
            echo "📌 Using video URL: $VIDEO_URL"

            if python upload.py; then
              echo "✅ Video $i posted successfully."
            else
              echo "⚠️ Video $i failed to post (see error above) — continuing to next video instead of stopping the whole run."
            fi

            if [ "$i" -lt 4 ]; then
              echo "⏳ Waiting 2 minutes before next video..."
              sleep 120
            fi
          done
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Commit backlog changes (if any)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f pending_queue.json ]; then
            git add pending_queue.json
            git diff --staged --quiet || git commit -m "Update pending video backlog"
            git push
          fi
