name: content-pipeline
on:
  schedule:
    - cron: '0 2 * * *'    # run 1 — 02:00 UTC
    - cron: '0 8 * * *'    # run 2 — 08:00 UTC
    - cron: '0 14 * * *'   # run 3 — 14:00 UTC
    - cron: '0 20 * * *'   # run 4 — 20:00 UTC
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system audio deps
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Retry any backlogged videos first
        run: python retry_pending.py
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}

      - name: Fetch background video
        run: python fetch_background.py

      - name: Generate voiceover + timestamps (also generates the story internally)
        run: python generate_audio.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Render video
        run: python render_video.py

      - name: Host video on Cloudinary
        run: python upload_to_cloudinary.py
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

      - name: Post to TikTok via Zernio
        run: |
          export VIDEO_URL=$(cat video_url.txt)
          python upload.py
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}

      - name: Commit pipeline state changes
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pending_queue.json queue_log.json recent_story_topics.json recent_backgrounds.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update pipeline state"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Rebase failed; preserving local files and retrying on next run."
              exit 0
            }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt/3); retrying..."
            sleep 3
          done

          echo "Could not push after retries; generated content itself was already processed."
