name: content-pipeline
on:
  schedule:
    - cron: '0 2 * * *'    # run 1 — 02:00 UTC
    - cron: '0 8 * * *'    # run 2 — 08:00 UTC
    - cron: '0 14 * * *'   # run 3 — 14:00 UTC
    - cron: '0 20 * * *'   # run 4 — 20:00 UTC
  workflow_dispatch:

concurrency:
  group: tiktok-content-pipeline
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Retry any backlogged videos first
        run: python retry_pending.py
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}

      - name: Fetch background video
        run: python fetch_background.py

      - name: Generate voiceover + timestamps (also generates the story internally)
        run: python generate_audio.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          META1_API_KEY: ${{ secrets.META1_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Render video
        run: python render_video.py

      - name: Host video on Cloudinary
        run: python upload_to_cloudinary.py
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

      - name: Post to TikTok via Zernio
        run: |
          export VIDEO_URL=$(cat video_url.txt)
          python upload.py
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}

      - name: Commit backlog + queue log changes (if any)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add pending_queue.json queue_log.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No backlog or queue-log changes to commit."
            exit 0
          fi

          git commit -m "Update pending backlog / queue log"

          # Another workflow may have updated main while this job was running.
          # Rebase our small generated-data commit on top of the latest main,
          # then retry the push a few times if another race happens.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              echo "❌ Rebase conflict while updating generated queue files."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "✅ Queue changes pushed successfully."
              exit 0
            fi

            echo "⚠️ Push raced with another update; retrying ($attempt/3)..."
            sleep 3
          done

          echo "❌ Could not push after 3 attempts."
          exit 1
