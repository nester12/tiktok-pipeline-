name: content-pipeline
on:
  schedule:
    - cron: '0 14 * * *'   # runs daily at 14:00 UTC — edit as needed
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch background video
        run: python fetch_background.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Generate story
        run: python generate_story.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate voiceover + timestamps
        run: python generate_audio.py

      - name: Render video
        run: python render_video.py

      - name: Host video on Cloudinary (public URL for Buffer)
        id: host_video
        run: python upload_to_cloudinary.py
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

      - name: Post to TikTok via Buffer
        run: python upload.py
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          VIDEO_URL: ${{ steps.host_video.outputs.video_url }}
