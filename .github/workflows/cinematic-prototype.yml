name: cinematic-prototype-safe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Generate original horror story and narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KOKORO_VOICE: af_heart
          MIN_DURATION: '81'
          MAX_SINGLE_DURATION: '100'
          TARGET_DURATION: '90'
        run: python generate_audio.py
      - name: Prepare timed cinematic scenes
        run: python plan_scenes.py
      - name: Preview Inworld narration request without paid API call
        run: python generate_inworld_voice.py
      - name: Preview image generation without paid API call
        run: python generate_scene_images.py
      - name: Create free scene placeholders for first integration test
        run: python create_preview_placeholders.py
      - name: Render private cinematic integration preview
        run: python render_cinematic.py
      - name: Upload preview to Cloudinary (not TikTok)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          VIDEO_PATH: cinematic_prototype.mp4
        run: python upload_to_cloudinary.py
      - name: Upload review assets
        uses: actions/upload-artifact@v4
        with:
          name: horror-story-voice-and-scenes
          path: |
            story.txt
            narration.wav
            timestamps.json
            scene_plan.json
            audio_meta.json
            cinematic_prototype.mp4
            video_url.txt
          retention-days: 7

# Manual test only. No paid image API, email, Buffer, or TikTok publishing.\n# Cloudinary upload may be publicly accessible via its generated URL.
