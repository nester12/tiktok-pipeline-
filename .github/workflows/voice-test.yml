name: voice-clone-test

on:
  workflow_dispatch:
    inputs:
      test_text:
        description: 'Short sentence for the cloned voice to read'
        required: false
        default: 'I thought it was going to be an ordinary day, but one small detail changed everything.'

permissions:
  contents: read

jobs:
  test-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install OpenVoice V2 and MeloTTS
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install gdown 'Cython==0.29.36'
          pip install 'av==10.0.0' --no-build-isolation
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          pip install -e /tmp/OpenVoice
          pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download

      - name: Download OpenVoice V2 checkpoints
        run: |
          wget -q --show-progress -O /tmp/checkpoints_v2.zip https://myshell-public-repo-host.s3.amazonaws.com/openvoice/checkpoints_v2_0417.zip
          unzip -q /tmp/checkpoints_v2.zip -d /tmp/openvoice-checkpoints
          rm -rf checkpoints_v2
          if [ -d /tmp/openvoice-checkpoints/checkpoints_v2 ]; then
            mv /tmp/openvoice-checkpoints/checkpoints_v2 ./checkpoints_v2
          else
            mkdir -p checkpoints_v2
            cp -R /tmp/openvoice-checkpoints/* checkpoints_v2/
          fi
          test -f checkpoints_v2/converter/config.json
          test -f checkpoints_v2/converter/checkpoint.pth

      - name: Generate OpenVoice clone test
        env:
          VOICE_SOURCE_URL: 'https://drive.google.com/file/d/154LMIYT2ocStkSafa8SM8mSrbsVcpxm3/view?usp=sharing'
          VOICE_TEST_TEXT: ${{ inputs.test_text }}
        run: |
          export PYTHONPATH="/tmp/OpenVoice:${PYTHONPATH}"
          python voice_test.py

      - name: Upload voice test
        uses: actions/upload-artifact@v4
        with:
          name: openvoice-v2-cloned-voice-test
          path: voice_test_output.wav
          if-no-files-found: error
          retention-days: 3
