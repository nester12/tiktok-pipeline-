name: voice-clone-test

on:
  workflow_dispatch:
    inputs:
      test_text:
        description: 'Short sentence for the cloned voice to read'
        required: false
        default: 'I thought it was going to be an ordinary day, but one small detail changed everything.'

permissions:
  contents: read

jobs:
  test-voice:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install OpenVoice V2 and MeloTTS
        run: |
          python -m pip install --upgrade pip
          pip install 'setuptools<81' wheel gdown 'Cython==0.29.36'
          pip install 'av==10.0.0' --no-build-isolation
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          pip install -e /tmp/OpenVoice
          pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
          pip install 'setuptools<81'
          python -c "import pkg_resources; print('pkg_resources available')"

      - name: Install and verify MeloTTS language data
        run: |
          python - <<'PY'
          import nltk

          resources = [
              "averaged_perceptron_tagger",
              "averaged_perceptron_tagger_eng",
              "cmudict",
              "punkt",
              "punkt_tab",
          ]
          for resource in resources:
              print(f"Downloading NLTK resource: {resource}")
              nltk.download(resource, download_dir="/home/runner/nltk_data", quiet=False, raise_on_error=True)

          checks = [
              "taggers/averaged_perceptron_tagger",
              "taggers/averaged_perceptron_tagger_eng",
              "corpora/cmudict",
          ]
          for path in checks:
              nltk.data.find(path)
              print(f"Verified: {path}")

          from nltk import pos_tag
          tagged = pos_tag(["OpenVoice", "test"])
          print("NLTK POS tagger test passed:", tagged)
          PY

      - name: Download OpenVoice V2 checkpoints
        run: |
          rm -rf checkpoints_v2
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="myshell-ai/OpenVoiceV2",
              local_dir="checkpoints_v2",
          )
          PY
          test -f checkpoints_v2/converter/config.json
          test -f checkpoints_v2/converter/checkpoint.pth
          test -d checkpoints_v2/base_speakers/ses
          ls -la checkpoints_v2/base_speakers/ses

      - name: Generate OpenVoice clone test
        env:
          VOICE_SOURCE_URL: 'https://drive.google.com/file/d/154LMIYT2ocStkSafa8SM8mSrbsVcpxm3/view?usp=sharing'
          VOICE_TEST_TEXT: ${{ inputs.test_text }}
          NLTK_DATA: /home/runner/nltk_data
        run: |
          export PYTHONPATH="/tmp/OpenVoice:${PYTHONPATH}"
          python voice_test.py

      - name: Verify generated voice
        run: |
          test -s voice_test_output.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice_test_output.wav

      - name: Upload voice test
        uses: actions/upload-artifact@v4
        with:
          name: openvoice-v2-cloned-voice-test
          path: voice_test_output.wav
          if-no-files-found: error
          retention-days: 3
