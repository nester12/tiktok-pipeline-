name: test-post-only
on:
  workflow_dispatch:

jobs:
  test-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download a small sample video
        run: |
          curl -L -o final_short.mp4 "https://filesamples.com/samples/video/mp4/sample_640x360.mp4"
          ls -la final_short.mp4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Host video on Cloudinary (public URL for Buffer)
        id: host_video
        run: python upload_to_cloudinary.py
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

      - name: Post to TikTok via Buffer
        run: python upload.py
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          VIDEO_URL: ${{ steps.host_video.outputs.video_url }}
