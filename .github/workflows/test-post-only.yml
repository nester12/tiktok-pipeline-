name: test-post-only
on:
  workflow_dispatch:

jobs:
  test-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download a small sample video
        run: |
          curl -L -o final_short.mp4 "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4"
          ls -la final_short.mp4
          file final_short.mp4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Host video on Cloudinary
        id: host_video
        run: python upload_to_cloudinary.py
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

      - name: Verify hosted video URL
        shell: bash
        run: |
          test -s video_url.txt
          echo "Cloudinary URL created successfully."

      - name: Add test video to Zernio queue
        shell: bash
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_MORNING_QUEUE_ID: ${{ secrets.ZERNIO_MORNING_QUEUE_ID }}
          ZERNIO_MIDDAY_QUEUE_ID: ${{ secrets.ZERNIO_MIDDAY_QUEUE_ID }}
          ZERNIO_AFTERNOON_QUEUE_ID: ${{ secrets.ZERNIO_AFTERNOON_QUEUE_ID }}
          ZERNIO_EVENING_QUEUE_ID: ${{ secrets.ZERNIO_EVENING_QUEUE_ID }}
        run: |
          set -euo pipefail
          export VIDEO_URL="$(cat video_url.txt)"
          python upload.py

      - name: Show queue result
        if: always()
        shell: bash
        run: |
          if [ -f queue_log.json ]; then
            echo "Queue log:"
            cat queue_log.json
          fi
          if [ -f pending_queue.json ]; then
            echo "Pending/backlog log:"
            cat pending_queue.json
          fi
